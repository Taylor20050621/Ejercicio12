<!-- src/app/componentes/lista-tareas/lista-tareas.component.html -->
<div class="container">
  <h2>Gestor de Tareas Interactivo - Eventos en Angular</h2>
  <!-- Escucha de eventos personalizados del componente hijo -->
  <app-buscador-tarea 
    (nuevaTareaEvent)="onAgregarTarea($event)"
    (filtrarEvent)="onFiltrar($event)">
  </app-buscador-tarea>
  <div class="status-bar">
    <p><strong>Último evento global registrado:</strong> {{ ultimoMensajeGlobal() }}</p>
  </div>
  <ul class="task-list">
    @for (t of tareasFiltradas; track t.id) {
      <li 
        [class.completed]="t.completada" 
        (click)="toggleCompletada(t.id)">
        <span class="title">{{ t.titulo }}</span>
        <span class="badge" [class]="t.prioridad.toLowerCase()">{{ t.prioridad }}</span>
        <!-- event.stopPropagation() evita que se active toggleCompletada -->
        <button class="delete-btn" (click)="eliminarTarea(t.id, $event)">Eliminar</button>
      </li>
    } @empty {
      <p class="empty">No hay tareas que coincidan con el filtro.</p>
    }
  </ul>
</div>
